# CoastalBench surface reconstruction — GL_rbf_ENH backbone
# Fields: u_surf (conditioning), v_surf, temp_surf, zeta (all reconstructed)
# Sensors: random ocean-point subsampling of u_surf
Demo_Num: 1
device_ids: [0]
# --- Data ---
data: "/orcd/scratch/orcd/010/alexis31/CoastalBench-heavy"  # directory of daily .nc files
static_nc: "/orcd/scratch/orcd/010/alexis31/CoastalBench-heavy/static.nc"
save_dir: "Save_TrainedModel/cb_GL_rbf_enh"
RELOAD: false
cb_var_names:   ["u", "v", "temp", "zeta"]
cb_field_names: ["u_surf", "v_surf", "temp_surf", "zeta"]
cb_var_level:   11    # VERIFY: set to whichever s-index is the surface level
cb_use_wetdry_mask: false
seed: 42
epochs: 1000
batch_size: 4          # N_ocean ≈ 400k; keep batch very small
lr: 1.0e-4
weight_decay: 1.0e-6
train_ratio: 0.85
time_stride: 1
num_workers: 4
# --- Backbone ---
backbone: "GL_rbf_ENH"
hidden_dim: 256
cond_dim: 128
field_embed_dim: 128
rbf_sigma: 0.05        # calibrated to normalized [0,1]^2; may need slight increase vs 3D
sigma_min: 1.0e-4
USE_FOURIER_PE: true
fourier_pe_num_bands: 32
fourier_pe_max_freq: 64.0
latent_dim: 256
num_latents: 128
num_heads: 8
num_latent_blocks: 4
ff_mult: 4
attn_dropout: 0.0
mlp_dropout: 0.0
summary_type: "mean"
gather_mode: "topk_rbf_glres"
gather_topk: 32
sensor_local_topk: 16
gather_query_chunk_size: 2048
learnable_rbf_sigma: true
neighbor_backend: "torch"    # switch to "keops" if available for memory savings
sensor_local_dropout: 0.0
sensor_coord_encoding: "fourier"
latent_sensor_reinject: true
latent_reinject_every: 1
query_latent_readout: true
query_readout_type: "coord"
query_readout_scale_init: 1.0e-2
enhanced_head_norm: true
glres_scale_init: 1.0e-2
# --- Training process ---
n_query_points: 4096    # subsample of N_ocean per training step
query_sampling: "obs_mix"
query_sample_near_ratio: 0.25
query_sample_far_ratio: 0.25
query_sample_sigma_ratio: 0.05
prior: "rff"
rff_features: 256
rff_lengthscale: 0.15
eval_every: 10
save_every: 100
n_steps_generation: 16
benchmark_n_steps: [2, 4, 8]
ode_solver: "euler"
# --- Conditioning: sparse sensors on u_surf only ---
cond_fields:    [0]       # index 0 within loaded fields = u_surf
n_obs_min_list: [64]
n_obs_max_list: [256]
vis_cond_fields: [0]
vis_n_obs_list: [128]
