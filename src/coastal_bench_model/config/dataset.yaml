# Case dataset contract for CoastalBench.
# Generated by hdf5convert.py from the carved CoastalBench NC subset.
#
# Active dataset: 681 daily dates (2009-2010), grid-bbox eta[140..620] xi[20..540],
# always-wet ocean mask, 4 training channels (u, v, temp, salt), level 0 (surface).
# HDF5 produced by the incremental hdf5convert.py (memory-safe, no OOM).

dataset:

  # Path to the HDF5 file produced by hdf5convert.py.
  # The output directory ends in _grid_h5 when --grid-bbox was used.
  # UPDATE THIS PATH after conversion completes:
  
  path: /orcd/scratch/orcd/010/alexis31/CoastalBench-heavy/coastal_bench.h5
  split: train  # choices: train | validation | test

  # Sample representation.
  reconstruction_unit: snapshot

  # Field schema: u (eastward vel), v (northward vel), temp (temperature), salt (salinity).
  field_names: [u, v, temp, salt]
  field_units: [m/s, m/s, degC, psu]

  # Robust 99th-percentile normalization is recommended for ocean data
  # which can have occasional extreme values near boundaries.
  normalization: robust_99  # choices: none | mean_std | robust_99

  # Temporal sampling (training-time, sub-selects from whatever is stored in HDF5).
  # HDF5 stores T_stored snapshots/day (set by --time-stride at conversion time).
  # time_stride here further sub-selects: effective_T = T_stored / time_stride.
  #   time_stride: 1  → use all stored snapshots (e.g. 48 at 30-min, or 24 at 1-hr)
  #   time_stride: 2  → every other stored snapshot
  #   time_stride: 6  → ~8 snapshots/day from 48-snapshot HDF5 (3-hr effective)
  time_stride: 2

  # CoastalBench is a research dataset; not eligible for the formal benchmark suite.
  benchmark_eligible: false
  allow_nonbenchmark: true

  # Coordinate geometry: lon/lat → 2-D point cloud after ocean masking.
  coordinate_dim: 2
  # grid_shape is intentionally omitted here so it is auto-detected from the
  # HDF5 grid_shape attribute (= N_ocean, the number of wet grid points).
  # Set it explicitly here if you need to override, e.g.:
  #   grid_shape: [150000]

